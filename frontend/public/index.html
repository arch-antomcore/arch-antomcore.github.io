            (function(){
                var shown = false;
                function showCrash(msg) {
                    if (shown) return;
                    shown = true;
                    var root = document.getElementById('root');
                    if (root && !root.innerHTML.trim()) {
                        root.innerHTML =
                            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f1e8;padding:2rem">' +
                            '<div style="max-width:480px;text-align:center;font-family:system-ui,sans-serif">' +
                            '<h1 style="font-size:1.5rem;color:#211d18;margin-bottom:1rem">Ops — algo deu errado</h1>' +
                            '<p style="color:#666;margin-bottom:1.5rem;font-size:0.875rem">Se você usa o <strong>Brave</strong>, desative o Brave Shields para este site clicando no ícone do leão na barra de endereço.</p>' +
                            '<pre style="background:#211d18;color:#f87171;padding:1rem;border-radius:12px;font-size:0.75rem;text-align:left;overflow:auto;max-height:200px">' + msg + '</pre>' +
                            '<button onclick="location.reload()" style="margin-top:1.5rem;padding:0.6rem 1.5rem;border-radius:999px;border:1px solid #211d18;background:#211d18;color:#f4f1e8;cursor:pointer;font-size:0.875rem">Recarregar</button>' +
                            '</div></div>';
                    }
                }
                window.addEventListener('error', function(e) {
                    if (e.error && e.error instanceof DOMException && e.error.name === 'DataCloneError') return;
                    setTimeout(function(){ showCrash(e.message || 'Unknown error'); }, 500);
                });
                window.addEventListener('unhandledrejection', function(e) {
                    var msg = e.reason ? (e.reason.message || String(e.reason)) : 'Chunk load failed';
                    setTimeout(function(){ showCrash(msg); }, 500);
                });
            })();
        </script>
